# Shared Docker host VM for ad-hoc containers; projects with a real stack
# get their own instance (cantrips/lima/vm-up). Created by rites/lima with:
#   limactl start --name docker ~/.lima-templates/docker.yaml
# vmType and disk are fixed at creation; changing them means
# `limactl delete docker` and a recast (images and volumes inside are lost).
# cpus, memory and mounts can be changed with `limactl edit docker` and a
# restart; the instance keeps its own copy, so editing this file alone
# does not change an existing instance.
minimumLimaVersion: 2.0.0

# Rootless (upstream's default): an escaped container is an unprivileged
# user in the VM, not root. The cost is no published ports below 1024 and no
# privileged containers, which ad-hoc use doesn't need; a project stack that
# does gets its own rootful instance (cantrips/lima/vm-up).
base:
  - template:docker

vmType: vz
mountType: virtiofs

cpus: 2
memory: 4GiB
disk: 100GiB

# amd64 images at usable speed. Rosetta itself is installed by rites/lima.
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

# Only listed paths are visible to the VM: a `-v` outside them silently
# yields an empty directory. Work lives under ~/Workbench, and Docker
# inside the VM can write anything mounted here, so nothing else from the
# home directory is exposed. Lima would merge the base's read-only ~ mount
# into this list; rite.py deletes it with `--set` at creation.
mounts:
  - location: "~/Workbench"
    writable: true
