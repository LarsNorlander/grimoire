# tmux configuration, managed by grimoire

# ── Prefix: Ctrl-Space ──
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Terminal behavior ──
set -s escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -g history-limit 50000
set -g mouse on
set -g focus-events on

# ── Windows and panes numbered from 1, renumbered on close ──
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Copy mode: vi keys, yank to macOS clipboard ──
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Splits: vim-style v/s, new panes/windows open in the current pane's path ──
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S choose-tree -Zs  # session picker, displaced from s
bind c new-window -c "#{pane_current_path}"

# ── Ctrl-h/j/k/l pane navigation, vim-aware: keys pass through to a
#    running (n)vim pane so vim-tmux-navigator can take over there ──
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind C-l send-keys 'C-l'  # prefix + Ctrl-l still clears the screen

# ── Reload config ──
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# ── Panes: cyan border on the active pane ──
set -g pane-active-border-style "fg=cyan"

# ── Resize: navigation keys in the prefix table, repeatable while active ──
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind Tab last-window  # displaced from l

# ── Status bar — transparent background, dark-white (ANSI 7) text, at the top ──
set -g status-style "bg=default,fg=white"
set -g status-position top

# Left: session name; windows: white inactive, bright bold current with cyan star
set -g status-left "#[fg=blue,bold] #S #[fg=brightblack]│ "
set -g status-left-length 30
set -g window-status-format "#[fg=white] #I·#W "
set -g window-status-current-format "#[fg=brightwhite,bold] #I#[fg=cyan]*#[fg=brightwhite]#W#{?window_zoomed_flag,#[fg=cyan] Z,} "

# Right: host, local date, UTC clock (strftime is local-only, hence date -u)
set -g status-right "#[fg=white]#h · %a %d %b #[fg=white,bold]#(date -u +%%H:%%M) UTC "
