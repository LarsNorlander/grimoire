persistent-workspaces = ["Slack", "Notion", "Chrome"]

[mode.main.binding]
    alt-5 = 'workspace Slack'
    alt-8 = 'workspace Notion'
    alt-9 = 'workspace Chrome'
    alt-shift-5 = ['move-node-to-workspace Slack', 'workspace Slack']
    alt-shift-8 = ['move-node-to-workspace Notion', 'workspace Notion']
    alt-shift-9 = ['move-node-to-workspace Chrome', 'workspace Chrome']

[grimoire.service-d]
    # Rite directive, not an AeroSpace binding: spliced into service-mode `d`
    # after base's own entries and before its exit commands.
    before-exit = [
        'move-workspace-to-monitor --workspace Slack built-in main',
        'move-workspace-to-monitor --workspace Notion built-in main',
        'move-workspace-to-monitor --workspace Chrome built-in main',
        'exec-and-forget $HOME/.grimoire/cantrips/aerospace/place-windows com.tinyspeck.slackmacgap=Slack notion.id=Notion com.google.Chrome=Chrome+Workbench',
        'workspace Workbench',
    ]
